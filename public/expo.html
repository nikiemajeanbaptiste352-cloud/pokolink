<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ouvrir AfriConnect · Expo Go</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0b6b3a;
        color: #fff;
      }
      main {
        width: min(24rem, 100%);
        text-align: center;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
      p { margin: 0 0 1rem; line-height: 1.45; opacity: 0.95; }
      .btn {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        margin: 0.65rem 0;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #0b6b3a;
        font-weight: 800;
        font-size: 1.05rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .btn:active { transform: scale(0.98); opacity: 0.92; }
      .btn.secondary {
        background: transparent;
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.7);
      }
      code, .box {
        display: block;
        margin-top: 0.75rem;
        padding: 0.85rem;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.35);
        word-break: break-all;
        font-size: 0.95rem;
      }
      .hint { font-size: 0.9rem; opacity: 0.9; margin-top: 1rem; }
      #status { min-height: 1.25rem; margin-top: 0.75rem; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>AfriConnect</h1>
      <p>Appuie sur le bouton pour ouvrir dans <b>Expo Go</b>.</p>

      <!-- Intent Android : ouvre Expo Go même si exp:// n’est pas cliquable dans Chrome -->
      <a
        id="open"
        class="btn"
        href="intent://192.168.100.12:8081#Intent;scheme=exp;package=host.exp.exponent;end"
      >Ouvrir dans Expo Go</a>

      <button type="button" class="btn secondary" id="copy">Copier le lien Expo</button>

      <div class="box" id="url">exp://192.168.100.12:8081</div>
      <p class="hint">
        Si rien ne s’ouvre : Expo Go → <b>Enter URL manually</b> → colle le lien → Connect.
      </p>
      <p id="status"></p>
    </main>
    <script>
      const EXPO_URL = 'exp://192.168.100.12:8081'
      const INTENT =
        'intent://192.168.100.12:8081#Intent;scheme=exp;package=host.exp.exponent;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dhost.exp.exponent;end'
      const open = document.getElementById('open')
      const status = document.getElementById('status')
      open.setAttribute('href', INTENT)

      open.addEventListener('click', function (e) {
        status.textContent = 'Ouverture d’Expo Go…'
        // Essai direct exp:// en plus de l’intent
        setTimeout(function () {
          window.location.href = EXPO_URL
        }, 400)
      })

      document.getElementById('copy').addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(EXPO_URL)
          status.textContent = 'Lien copié. Colle-le dans Expo Go.'
        } catch (err) {
          status.textContent = 'Copie manuelle : ' + EXPO_URL
        }
      })
    </script>
  </body>
</html>
